<header class="header">
  <div class="header__container">

    <a routerLink="/" class="header__logo">Derma Bastion</a>

    <nav class="header__nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ lang.t('nav.home') }}</a>
      <a routerLink="/" fragment="products">{{ lang.t('nav.products') }}</a>
      <a routerLink="/about" routerLinkActive="active">{{ lang.t('nav.about') }}</a>
      <a routerLink="/contact" routerLinkActive="active">{{ lang.t('nav.contact') }}</a>
      <a routerLink="/track" routerLinkActive="active">{{ lang.t('nav.track') }}</a>
    </nav>

    <div class="header__actions">
      <button type="button" class="header__lang" (click)="lang.toggle()" [attr.aria-label]="lang.t('header.langSwitch')">{{ lang.otherLabel() }}</button>

      <a routerLink="/wishlist" class="header__icon" [attr.aria-label]="lang.t('header.wishlist')">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
        @if (wishlist.count() > 0) {
          <span class="header__badge" aria-hidden="true">{{ wishlist.count() }}</span>
        }
      </a>

      <a routerLink="/cart" class="header__icon" [attr.aria-label]="lang.t('header.cart')">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        @if (cart.count() > 0) {
          <span class="header__badge" aria-hidden="true">{{ cart.count() }}</span>
        }
      </a>
    </div>

  </div>
</header>
